<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Celestial Strike - Ultimate Warfare</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020617;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 880px;
            background: radial-gradient(circle at bottom, #07132b 0%, #020617 100%);
            overflow: hidden;
            box-shadow: 0 0 60px rgba(2, 132, 199, 0.25);
            border-left: 1px solid rgba(56, 189, 248, 0.2);
            border-right: 1px solid rgba(56, 189, 248, 0.2);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #hud-top {
            position: absolute;
            top: 10px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            z-index: 20;
        }
        .hud-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(56, 189, 248, 0.35);
            border-radius: 12px;
            padding: 6px 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
            pointer-events: auto;
        }
        .hp-bar-container {
            width: 160px;
            height: 14px;
            background: #0b1120;
            border-radius: 7px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-top: 4px;
            position: relative;
        }
        @media (min-width: 600px) {
            .hp-bar-container { width: 220px; height: 16px; }
        }
        #player-hp-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #10b981, #059669);
            transition: width 0.15s ease-out;
        }
        .hp-text {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.8px;
            text-shadow: 0 1px 3px #000;
        }
        .hud-stats {
            font-size: 11px;
            font-weight: 700;
            color: #38bdf8;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .btn-settings-gear {
            background: rgba(15, 23, 42, 0.9);
            border: 1.5px solid #38bdf8;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 14px rgba(56, 189, 248, 0.35);
            transition: transform 0.2s ease, border-color 0.2s ease;
            pointer-events: auto;
        }
        .btn-settings-gear:hover {
            transform: rotate(45deg) scale(1.08);
            border-color: #34d399;
        }
        .gear-svg {
            width: 18px;
            height: 18px;
            fill: #38bdf8;
        }
        #boss-ui {
            display: none;
            position: absolute;
            top: 64px;
            left: 50%;
            transform: translateX(-50%);
            width: 76%;
            max-width: 480px;
            text-align: center;
            z-index: 20;
            pointer-events: none;
        }
        .boss-hp-box {
            width: 100%;
            height: 13px;
            background: rgba(20, 5, 10, 0.9);
            border: 1px solid #f43f5e;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 3px;
            box-shadow: 0 0 15px rgba(244, 63, 94, 0.5);
        }
        #boss-hp-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #f43f5e, #be123c);
        }
        #skills-bar {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            width: 96%;
            max-width: 500px;
            justify-content: center;
            z-index: 20;
        }
        .skill-slot {
            flex: 1;
            height: 60px;
            max-width: 72px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            border: 1.5px solid #38bdf8;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 3px 2px;
            cursor: pointer;
            position: relative;
            box-shadow: 0 4px 14px rgba(0, 150, 255, 0.25);
            touch-action: manipulation;
            transition: transform 0.1s, border-color 0.2s;
        }
        .skill-slot:active {
            transform: scale(0.92);
        }
        .skill-slot.ready {
            border-color: #34d399;
            box-shadow: 0 0 12px rgba(52, 211, 153, 0.5);
        }
        .skill-slot.empty {
            border-color: #475569;
            opacity: 0.5;
            box-shadow: none;
        }
        .skill-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px;
        }
        .skill-key {
            font-size: 8px;
            font-weight: 900;
            color: #94a3b8;
        }
        .skill-lvl {
            font-size: 8px;
            color: #fbbf24;
            font-weight: 800;
        }
        .skill-icon {
            font-size: 15px;
            line-height: 1;
        }
        .skill-name {
            font-size: 8px;
            font-weight: 700;
            color: #e2e8f0;
            text-align: center;
        }
        .skill-upgrade-btn {
            font-size: 7.5px;
            font-weight: 800;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            padding: 1px 4px;
            border-radius: 4px;
            margin-top: 1px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: none;
        }
        .skill-upgrade-btn.can-upgrade {
            display: block;
            animation: pulseUp 1.2s infinite;
        }
        @keyframes pulseUp {
            0% { transform: scale(0.95); opacity: 0.85; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.85; }
        }
        #settings-modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 6, 23, 0.85);
            backdrop-filter: blur(10px);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .modal-card {
            background: linear-gradient(145deg, rgba(15, 23, 42, 0.98), rgba(8, 14, 26, 0.98));
            border: 2px solid rgba(56, 189, 248, 0.45);
            box-shadow: 0 0 45px rgba(2, 132, 199, 0.45);
            border-radius: 18px;
            padding: 26px 32px;
            width: 88%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 13px;
        }
        .modal-title {
            font-size: 19px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #38bdf8;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .menu-btn {
            width: 100%;
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            letter-spacing: 1px;
            border: 1px solid transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: all 0.15s ease;
        }
        .btn-resume {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: #fff;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
        }
        .btn-resume:hover {
            transform: translateY(-2px);
            border-color: #60a5fa;
        }
        .btn-restart {
            background: rgba(30, 41, 59, 0.85);
            color: #f1f5f9;
            border: 1px solid rgba(148, 163, 184, 0.3);
        }
        .btn-restart:hover {
            transform: translateY(-2px);
            border-color: #f59e0b;
            color: #fbbf24;
        }
        .btn-exit {
            background: rgba(30, 10, 20, 0.8);
            color: #fda4af;
            border: 1px solid rgba(244, 63, 94, 0.35);
        }
        .btn-exit:hover {
            background: rgba(190, 18, 60, 0.9);
            transform: translateY(-2px);
            color: #fff;
        }
        #game-over-screen, #exit-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 10, 0.94);
            backdrop-filter: blur(10px);
            z-index: 110;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="canvas"></canvas>

    <!-- Top HUD -->
    <div id="hud-top">
        <div class="hud-card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="font-weight:700; font-size:11px; color:#38bdf8;">COMMANDER JET</span>
                <span id="tier-badge" style="background:#0369a1; font-size:9px; padding:1px 5px; border-radius:3px; font-weight:800; margin-left:6px;">MK-1</span>
            </div>
            <div class="hp-bar-container">
                <div id="player-hp-bar"></div>
                <div id="hp-value" class="hp-text">400 / 400</div>
            </div>
        </div>

        <div style="display: flex; gap: 8px; align-items: center;">
            <div class="hud-card hud-stats">
                <div>PTS: <span id="pts-txt" style="color:#34d399;">0</span></div>
                <div>SCORE: <span id="score-txt" style="color:#f8fafc;">0</span></div>
                <div>WAVE: <span id="wave-txt" style="color:#fbbf24;">1</span></div>
            </div>

            <button class="btn-settings-gear" id="gear-btn" onclick="openSettings()" title="Settings / Pause">
                <svg class="gear-svg" viewBox="0 0 24 24">
                    <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- Center Settings / Pause Popup Modal -->
    <div id="settings-modal">
        <div class="modal-card">
            <div class="modal-title">⚙️ Game Menu</div>
            <button class="menu-btn btn-resume" onclick="resumeGame()">
                ▶️ Resume Game
            </button>
            <button class="menu-btn btn-restart" onclick="confirmRestart()">
                🔄 Restart Mission
            </button>
            <button class="menu-btn btn-exit" onclick="exitGame()">
                ⏹️ Exit Game
            </button>
        </div>
    </div>

    <!-- Boss HUD -->
    <div id="boss-ui">
        <div id="boss-name" style="font-size:11px; font-weight:900; color:#fda4af; letter-spacing:1.5px;">BOSS ALERT</div>
        <div class="boss-hp-box">
            <div id="boss-hp-fill"></div>
        </div>
    </div>

    <!-- Active Skills Dock -->
    <div id="skills-bar">
        <div class="skill-slot ready" id="slot-1" onclick="handleSkillClick(1, event)">
            <div class="skill-header">
                <span class="skill-key">[1]</span>
                <span class="skill-lvl" id="lvl-1">Lv.1</span>
            </div>
            <span class="skill-icon">🌀</span>
            <span class="skill-name">Nova</span>
            <button class="skill-upgrade-btn" id="up-1" onclick="upgradeSkill(1, event)">UP (10)</button>
        </div>
        <div class="skill-slot ready" id="slot-2" onclick="handleSkillClick(2, event)">
            <div class="skill-header">
                <span class="skill-key">[2]</span>
                <span class="skill-lvl" id="lvl-2">Lv.1</span>
            </div>
            <span class="skill-icon">🚀</span>
            <span class="skill-name">Missiles</span>
            <button class="skill-upgrade-btn" id="up-2" onclick="upgradeSkill(2, event)">UP (10)</button>
        </div>
        <div class="skill-slot ready" id="slot-3" onclick="handleSkillClick(3, event)">
            <div class="skill-header">
                <span class="skill-key">[3]</span>
                <span class="skill-lvl" id="lvl-3">Lv.1</span>
            </div>
            <span class="skill-icon">⚡</span>
            <span class="skill-name">Beams</span>
            <button class="skill-upgrade-btn" id="up-3" onclick="upgradeSkill(3, event)">UP (10)</button>
        </div>
        <div class="skill-slot ready" id="slot-4" onclick="handleSkillClick(4, event)">
            <div class="skill-header">
                <span class="skill-key">[4]</span>
                <span class="skill-lvl" id="lvl-4">Lv.1</span>
            </div>
            <span class="skill-icon">🌌</span>
            <span class="skill-name">Vortex</span>
            <button class="skill-upgrade-btn" id="up-4" onclick="upgradeSkill(4, event)">UP (10)</button>
        </div>
        <div class="skill-slot ready" id="slot-5" onclick="handleSkillClick(5, event)">
            <div class="skill-header">
                <span class="skill-key">[5]</span>
                <span class="skill-lvl" id="lvl-5">Lv.1</span>
            </div>
            <span class="skill-icon">🛡️</span>
            <span class="skill-name">Aegis</span>
            <button class="skill-upgrade-btn" id="up-5" onclick="upgradeSkill(5, event)">UP (10)</button>
        </div>
    </div>

    <!-- Screens -->
    <div id="exit-screen">
        <h1 style="color:#38bdf8; font-size:32px; font-weight:900; letter-spacing:2px;">MISSION ABORTED</h1>
        <p style="color:#94a3b8; margin-top:8px;">আপনি মিশন স্থগিত করেছেন।</p>
        <button class="menu-btn btn-resume" style="width:200px; margin-top:20px;" onclick="confirmRestart()">নতুন মিশন শুরু</button>
    </div>

    <div id="game-over-screen">
        <h1 style="color:#ef4444; font-size:36px; font-weight:900; letter-spacing:3px;">MISSION FAILED</h1>
        <p style="color:#94a3b8; margin-top:8px;">আপনার বিমান ধ্বংসপ্রাপ্ত হয়েছে!</p>
        <div style="font-size:22px; margin-top:14px; color:#38bdf8;">ফাইনাল স্কোর: <span id="final-score">0</span></div>
        <button class="menu-btn btn-resume" style="width:200px; margin-top:20px;" onclick="confirmRestart()">আবার শুরু করুন</button>
    </div>
</div>

<script>
/**
 * PNG Image Assets Loader
 */
const IMAGES = {
    main: {},
    helper: {},
    enemy: {},
    boss: {}
};

function loadPlaneImages() {
    for (let i = 1; i <= 5; i++) {
        const m = new Image();
        m.src = `Main%20Plane%20${i}.png`;
        IMAGES.main[i] = m;

        const h = new Image();
        h.src = `Helper%20Plane%20${i}.png`;
        IMAGES.helper[i] = h;

        const e = new Image();
        e.src = `Enemy%20Plane%20${i}.png`;
        IMAGES.enemy[i] = e;

        const b = new Image();
        b.src = `Boss%20Plane%20${i}.png`;
        IMAGES.boss[i] = b;
    }
}
loadPlaneImages();

/**
 * Audio Synthesizer (Zero Dependencies Web Audio API)
 */
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function initAudio() {
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'laser') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(140, now + 0.09);
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.09);
        osc.start(now);
        osc.stop(now + 0.09);
    } else if (type === 'beam') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(450, now);
        osc.frequency.linearRampToValueAtTime(850, now + 0.08);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
    } else if (type === 'heavy_plasma') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(65, now + 0.2);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
    } else if (type === 'explosion') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(25, now + 0.26);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.26);
        osc.start(now);
        osc.stop(now + 0.26);
    } else if (type === 'pickup') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(450, now);
        osc.frequency.linearRampToValueAtTime(950, now + 0.14);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.14);
        osc.start(now);
        osc.stop(now + 0.14);
    } else if (type === 'shield_on') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(680, now + 0.28);
        gain.gain.setValueAtTime(0.16, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.28);
        osc.start(now);
        osc.stop(now + 0.28);
    } else if (type === 'shield_break') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(500, now);
        osc.frequency.exponentialRampToValueAtTime(90, now + 0.35);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.35);
        osc.start(now);
        osc.stop(now + 0.35);
    }
}

/**
 * Canvas & Dimensions Setup
 */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const container = document.getElementById('game-container');

let W = 0, H = 0;
function resizeCanvas() {
    W = canvas.width = container.clientWidth || window.innerWidth;
    H = canvas.height = container.clientHeight || window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const keys = {};
let targetX = W / 2, targetY = H * 0.8;
let isPaused = false;
let isGameOver = false;

window.addEventListener('keydown', e => {
    initAudio();
    keys[e.key.toLowerCase()] = true;
    if (e.key === 'Escape' || e.key.toLowerCase() === 'p') {
        toggleSettings();
    }
    if (!isPaused && ['1','2','3','4','5'].includes(e.key)) {
        useSkill(parseInt(e.key));
    }
});
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

window.addEventListener('mousemove', e => {
    if (isPaused) return;
    initAudio();
    const rect = canvas.getBoundingClientRect();
    targetX = e.clientX - rect.left;
    targetY = e.clientY - rect.top;
});

function handleTouch(e) {
    if (isPaused) return;
    initAudio();
    const rect = canvas.getBoundingClientRect();
    const touch = e.touches[0];
    if (touch) {
        targetX = touch.clientX - rect.left;
        targetY = touch.clientY - rect.top - 20;
    }
}
canvas.addEventListener('touchstart', handleTouch, { passive: true });
canvas.addEventListener('touchmove', handleTouch, { passive: true });

function openSettings() {
    isPaused = true;
    document.getElementById('settings-modal').style.display = 'flex';
}

function resumeGame() {
    isPaused = false;
    document.getElementById('settings-modal').style.display = 'none';
}

function toggleSettings() {
    if (isGameOver) return;
    if (isPaused) resumeGame();
    else openSettings();
}

function confirmRestart() {
    document.getElementById('settings-modal').style.display = 'none';
    document.getElementById('exit-screen').style.display = 'none';
    document.getElementById('game-over-screen').style.display = 'none';
    restartGame();
}

function exitGame() {
    isPaused = true;
    document.getElementById('settings-modal').style.display = 'none';
    document.getElementById('exit-screen').style.display = 'flex';
}

let score = 0;
let upgradePoints = 0;
let wave = 1;
let gameTime = 0;
let screenShake = 0;
let lastWingmanDropTime = 0;

const SKILL_UPGRADE_COSTS = { 2: 10, 3: 30, 4: 60, 5: 100 };
const SOLDIER_POINT_REWARDS = { 1: 1, 2: 5, 3: 10, 4: 15, 5: 20 };
const BOSS_POINT_REWARDS = { 1: 10, 2: 15, 3: 25, 4: 50, 5: 100 };
const SCORE_TIER_THRESHOLDS = {
    1: 0,
    2: 1000,
    3: 5000,
    4: 10000,
    5: 20000
};

const player = {
    x: W / 2,
    y: H * 0.8,
    baseMaxHp: 400,
    maxHp: 400,
    hp: 400,
    tier: 1,
    width: 58,
    height: 64,
    speed: 7.5,
    autoFireRate: 110,
    lastFire: 0,
    shieldHitsLeft: 0,
    shieldMaxHits: 5,
    shieldTimer: 0,
    activeSkills: {
        1: { lvl: 1, cooldown: 0 },
        2: { lvl: 1, cooldown: 0 },
        3: { lvl: 1, cooldown: 0 },
        4: { lvl: 1, cooldown: 0 },
        5: { lvl: 1, cooldown: 0 }
    },
    unibeamTimer: 0,
    homingPassiveTimer: 0
};

let wingmen = [];

function refreshWingmen() {
    wingmen = [];
    const count = Math.min(4, player.tier);
    const helperHp = Math.floor(player.maxHp / 5);
    for (let i = 0; i < count; i++) {
        const offsetDirection = (i % 2 === 0) ? -1 : 1;
        const dist = 38 + Math.floor(i / 2) * 26;
        wingmen.push({
            distX: offsetDirection * dist,
            distY: 15 + Math.floor(i / 2) * 15,
            x: player.x,
            y: player.y,
            maxHp: helperHp,
            hp: helperHp,
            size: 26 + player.tier * 2,
            tier: player.tier,
            lastShot: 0
        });
    }
}

function addOrRepairWingman() {
    const helperHp = Math.floor(player.maxHp / 5);
    for (let wm of wingmen) {
        if (wm.hp < wm.maxHp) {
            wm.hp = wm.maxHp;
            addPopup(wm.x, wm.y - 20, 'WINGMAN REPAIRED!', '#34d399');
            return;
        }
    }
    if (wingmen.length < Math.min(4, player.tier + 1)) {
        const idx = wingmen.length;
        const offsetDirection = (idx % 2 === 0) ? -1 : 1;
        const dist = 38 + Math.floor(idx / 2) * 26;
        wingmen.push({
            distX: offsetDirection * dist,
            distY: 15 + Math.floor(idx / 2) * 15,
            x: player.x,
            y: player.y,
            maxHp: helperHp,
            hp: helperHp,
            size: 26 + player.tier * 2,
            tier: player.tier,
            lastShot: 0
        });
        addPopup(player.x, player.y - 40, '+1 WINGMAN DRONE!', '#34d399');
    } else {
        player.hp = Math.min(player.maxHp, player.hp + 120);
        addPopup(player.x, player.y - 40, 'FLEET OVERCHARGE!', '#38bdf8');
    }
}

let bullets = [];
let enemyBullets = [];
let enemies = [];
let drops = [];
let particles = [];
let shockwaves = [];
let blackHoles = [];
let textPopups = [];
let stars = [];

for (let i = 0; i < 80; i++) {
    stars.push({
        x: Math.random() * (W || 800),
        y: Math.random() * (H || 800),
        size: Math.random() * 2 + 0.8,
        speed: Math.random() * 2.2 + 0.6,
        alpha: Math.random() * 0.8 + 0.2
    });
}

let boss = null;
let bossCooldown = 500;

function spawnBoss() {
    const tier = Math.min(wave, 5);
    const hpMap = {
        1: 32000,
        2: 50000,
        3: 80000,
        4: 120000,
        5: 200000
    };
    const hp = hpMap[tier] || (tier * 40000);

    boss = {
        x: W / 2,
        y: -140,
        targetY: 120,
        maxHp: hp,
        hp: hp,
        width: 160 + tier * 28,
        height: 120 + tier * 20,
        speedX: (tier === 5) ? 0 : 2.0,
        dir: 1,
        tier: tier,
        lastShot: 0,
        spiralAngle: 0,
        laserState: 'none',
        laserAimTimer: 0,
        laserAngle: 0,
        hasFiredLaser: false,
        spawnEscortTimer: 0
    };

    updateHUD();

    document.getElementById('boss-ui').style.display = 'block';
    const names = [
        'VANGUARD DESTROYER [MK-1]',
        'CYCLONE CRUSHER [MK-2]',
        'APOLLO HARBINGER [MK-3]',
        'VALKYRIE DREADNOUGHT [MK-4]',
        'APOCALYPSE MOTHERSHIP [MK-5]'
    ];
    document.getElementById('boss-name').innerText = names[tier - 1];
}

function spawnDrop(x, y, forcedType = null) {
    const types = ['medkit', 'score_orb', 'power_shard'];
    let type = forcedType || types[Math.floor(Math.random() * types.length)];

    if (!forcedType && (gameTime - lastWingmanDropTime > 1500) && Math.random() < 0.25) {
        type = 'wingman_kit';
        lastWingmanDropTime = gameTime;
    }

    drops.push({
        x, y,
        type,
        width: 24,
        height: 24,
        vy: 1.8,
        pulse: 0
    });
}

function handleSkillClick(slot, e) {
    if (e.target && e.target.classList.contains('skill-upgrade-btn')) return;
    useSkill(slot);
}

function upgradeSkill(slot, e) {
    if (e) e.stopPropagation();
    const sk = player.activeSkills[slot];
    if (sk.lvl >= 5) return;
    const cost = SKILL_UPGRADE_COSTS[sk.lvl + 1];
    if (upgradePoints >= cost) {
        upgradePoints -= cost;
        sk.lvl++;
        playSound('pickup');
        addPopup(player.x, player.y - 35, `SKILL [${slot}] -> LV.${sk.lvl}!`, '#34d399');
        updateSkillsHUD();
        updateHUD();
    }
}

function useSkill(slot) {
    if (isGameOver || isPaused) return;
    const skill = player.activeSkills[slot];
    if (skill.cooldown > 0) return;

    if (slot === 1) {
        const lvl = skill.lvl;
        skill.cooldown = 240;
        const bulletCount = 28 + (lvl * 6);
        const radius = (lvl >= 4) ? 7.5 : (lvl >= 3 ? 6.5 : 4.5);
        const splash = (lvl >= 3) ? (40 + lvl * 15) : 0;

        for (let i = 0; i < bulletCount; i++) {
            const angle = (Math.PI * 2 / bulletCount) * i;
            bullets.push({
                x: player.x,
                y: player.y,
                vx: Math.cos(angle) * 8.5,
                vy: Math.sin(angle) * 8.5,
                damage: 55 * lvl,
                type: 'nova',
                radius: radius,
                color: '#38bdf8',
                splashRadius: splash
            });
        }
        playSound('heavy_plasma');
    } else if (slot === 2) {
        const lvl = skill.lvl;
        skill.cooldown = 260;
        const count = 4 + (lvl * 2);
        const missileRadius = Math.min(10, 5 + lvl * 1.5);
        const splash = (lvl >= 3) ? (45 + lvl * 12) : 0;

        for (let i = 0; i < count; i++) {
            setTimeout(() => {
                bullets.push({
                    x: player.x + (Math.random() * 36 - 18),
                    y: player.y - 10,
                    vx: (Math.random() - 0.5) * 4,
                    vy: -7.5,
                    damage: 55 * lvl,
                    type: 'homing_missile',
                    radius: missileRadius,
                    color: '#fbbf24',
                    splashRadius: splash
                });
                playSound('heavy_plasma');
            }, i * 65);
        }
    } else if (slot === 3) {
        const lvl = skill.lvl;
        skill.cooldown = 320;
        player.unibeamTimer = 300;
        playSound('beam');
        addPopup(player.x, player.y - 35, `ION BEAMS ACTIVE (LV.${lvl})!`, '#06b6d4');
    } else if (slot === 4) {
        const lvl = skill.lvl;
        skill.cooldown = 360;
        blackHoles.push({
            x: player.x,
            y: player.y - 40,
            vy: -2.2,
            currentRadius: 18,
            targetRadius: 65 + (lvl * 25),
            duration: 320,
            suctionPower: 1.8 + (lvl * 0.9),
            damage: 8 * lvl,
            lvl: lvl
        });
        playSound('heavy_plasma');
    } else if (slot === 5) {
        const lvl = skill.lvl;
        skill.cooldown = 380;
        player.shieldMaxHits = 5 + (lvl - 1) * 2;
        player.shieldHitsLeft = player.shieldMaxHits;
        player.shieldTimer = 500;
        playSound('shield_on');
        addPopup(player.x, player.y - 45, `AEGIS SHIELD [${player.shieldHitsLeft}/5] ACTIVE!`, '#34d399');
    }

    updateSkillsHUD();
}

function updateSkillsHUD() {
    for (let s = 1; s <= 5; s++) {
        const slotEl = document.getElementById(`slot-${s}`);
        const lvlEl = document.getElementById(`lvl-${s}`);
        const upBtn = document.getElementById(`up-${s}`);
        const sk = player.activeSkills[s];

        lvlEl.innerText = `Lv.${sk.lvl}`;

        if (sk.cooldown <= 0) {
            slotEl.classList.add('ready');
            slotEl.classList.remove('empty');
        } else {
            slotEl.classList.remove('ready');
            slotEl.classList.add('empty');
        }

        if (sk.lvl < 5) {
            const nextCost = SKILL_UPGRADE_COSTS[sk.lvl + 1];
            upBtn.innerText = `UP (${nextCost})`;
            if (upgradePoints >= nextCost) {
                upBtn.classList.add('can-upgrade');
            } else {
                upBtn.classList.remove('can-upgrade');
            }
        } else {
            upBtn.innerText = 'MAX';
            upBtn.classList.remove('can-upgrade');
        }
    }
}

function addPopup(x, y, text, color = '#38bdf8') {
    textPopups.push({ x, y, text, color, alpha: 1, vy: -1.2 });
}

function createExplosion(x, y, count = 16, color = '#f97316', speed = 5) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = Math.random() * speed + 1;
        particles.push({
            x, y,
            vx: Math.cos(angle) * spd,
            vy: Math.sin(angle) * spd,
            size: Math.random() * 3.5 + 1.5,
            color,
            alpha: 1,
            decay: Math.random() * 0.03 + 0.02
        });
    }
}

function update() {
    if (isGameOver || isPaused) return;
    gameTime++;

    let newTier = 1;
    if (score >= SCORE_TIER_THRESHOLDS[5]) newTier = 5;
    else if (score >= SCORE_TIER_THRESHOLDS[4]) newTier = 4;
    else if (score >= SCORE_TIER_THRESHOLDS[3]) newTier = 3;
    else if (score >= SCORE_TIER_THRESHOLDS[2]) newTier = 2;

    if (newTier !== player.tier) {
        player.tier = newTier;
        document.getElementById('tier-badge').innerText = `MK-${newTier}`;
        addPopup(player.x, player.y - 45, `JET EVOLVED: MK-${newTier}!`, '#38bdf8');
        createExplosion(player.x, player.y, 30, '#38bdf8', 6);
        refreshWingmen();
    }

    for (let s = 1; s <= 5; s++) {
        if (player.activeSkills[s].cooldown > 0) {
            player.activeSkills[s].cooldown--;
            if (player.activeSkills[s].cooldown === 0) updateSkillsHUD();
        }
    }

    player.x += (targetX - player.x) * 0.18;
    player.y += (targetY - player.y) * 0.18;

    if (keys['arrowleft'] || keys['a']) targetX -= player.speed;
    if (keys['arrowright'] || keys['d']) targetX += player.speed;
    if (keys['arrowup'] || keys['w']) targetY -= player.speed;
    if (keys['arrowdown'] || keys['s']) targetY += player.speed;

    player.x = Math.max(player.width / 2, Math.min(W - player.width / 2, player.x));
    player.y = Math.max(player.height / 2, Math.min(H - 85, player.y));

    wingmen.forEach(wm => {
        wm.x += (player.x + wm.distX - wm.x) * 0.18;
        wm.y += (player.y + wm.distY - wm.y) * 0.18;

        if (gameTime - wm.lastShot > 45) {
            wm.lastShot = gameTime;
            bullets.push({
                x: wm.x,
                y: wm.y - 12,
                vx: 0,
                vy: -10,
                damage: 40 * wm.tier,
                type: 'wingman_bullet',
                radius: 3.5,
                color: '#34d399'
            });
        }
    });

    if (player.shieldTimer > 0) {
        player.shieldTimer--;
        if (player.shieldTimer === 0) player.shieldHitsLeft = 0;
    }

    const now = Date.now();
    if (now - player.lastFire > player.autoFireRate) {
        player.lastFire = now;
        spawnPlayerBullets();
    }

    stars.forEach(s => {
        s.y += s.speed;
        if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
    });

    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];

        if (b.type === 'homing_missile') {
            let target = null;
            let minDist = 9999;
            enemies.forEach(e => {
                const dist = Math.hypot(e.x - b.x, e.y - b.y);
                if (dist < minDist) { minDist = dist; target = e; }
            });
            if (boss && !target) target = boss;

            if (target) {
                const angle = Math.atan2(target.y - b.y, target.x - b.x);
                b.vx = Math.cos(angle) * 8.5;
                b.vy = Math.sin(angle) * 8.5;
            }
        }

        b.x += b.vx;
        b.y += b.vy;

        if (b.y < -50 || b.y > H + 50 || b.x < -50 || b.x > W + 50) {
            bullets.splice(i, 1);
            continue;
        }

        let bulletDestroyed = false;
        for (let j = enemies.length - 1; j >= 0; j--) {
            const e = enemies[j];
            if (Math.hypot(b.x - e.x, b.y - e.y) < b.radius + e.size) {
                e.hp -= b.damage;
                createExplosion(b.x, b.y, 4, b.color, 2);

                if (b.splashRadius > 0) {
                    createExplosion(b.x, b.y, 16, '#fbbf24', 5);
                    enemies.forEach(sub => {
                        if (Math.hypot(sub.x - b.x, sub.y - b.y) < b.splashRadius) {
                            sub.hp -= b.damage * 0.7;
                        }
                    });
                }

                if (e.hp <= 0) destroyEnemy(j);

                bulletDestroyed = true;
                bullets.splice(i, 1);
                break;
            }
        }

        if (bulletDestroyed) continue;

        if (boss && Math.hypot(b.x - boss.x, b.y - boss.y) < b.radius + boss.width / 2) {
            boss.hp -= b.damage;
            createExplosion(b.x, b.y, 5, '#fda4af', 3);
            bullets.splice(i, 1);
            updateBossHUD();
            if (boss.hp <= 0) destroyBoss();
        }
    }

    if (player.unibeamTimer > 0) {
        player.unibeamTimer--;
        if (player.unibeamTimer % 18 === 0) playSound('beam');
    }

    for (let k = blackHoles.length - 1; k >= 0; k--) {
        const bh = blackHoles[k];
        bh.y += bh.vy;
        if (bh.currentRadius < bh.targetRadius) bh.currentRadius += 0.5;
        bh.duration--;

        for (let j = enemies.length - 1; j >= 0; j--) {
            const e = enemies[j];
            const dist = Math.hypot(bh.x - e.x, bh.y - e.y);
            if (dist < bh.targetRadius * 2.5) {
                e.x += (bh.x - e.x) * 0.08 * bh.suctionPower;
                e.y += (bh.y - e.y) * 0.08 * bh.suctionPower;
                if (dist < bh.currentRadius && e.tier <= bh.lvl) {
                    destroyEnemy(j);
                } else {
                    e.hp -= bh.damage;
                    if (e.hp <= 0) destroyEnemy(j);
                }
            }
        }

        if (boss && Math.hypot(bh.x - boss.x, bh.y - boss.y) < bh.targetRadius + boss.width / 2) {
            boss.hp -= bh.damage * 0.6;
            updateBossHUD();
            if (boss.hp <= 0) destroyBoss();
        }

        if (bh.duration <= 0 || bh.y < -100) {
            createExplosion(bh.x, bh.y, 25, '#c084fc', 6);
            blackHoles.splice(k, 1);
        }
    }

    if (!boss && Math.random() < 0.045 + (wave * 0.008)) spawnSoldier(player.tier);
    else if (boss && Math.random() < 0.02) spawnSoldier(player.tier);

    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.y += e.vy;
        e.x += Math.sin(gameTime * 0.04 + e.offset) * e.vx;

        if (e.y > H + 40) {
            enemies.splice(i, 1);
            continue;
        }

        if (e.y < player.y - 40 && Math.random() < 0.015) {
            enemyBullets.push({
                x: e.x,
                y: e.y + e.size,
                vx: (player.x - e.x) * 0.012,
                vy: 4.8,
                radius: 4,
                damage: 15
            });
        }
    }

    if (boss) {
        if (boss.y < boss.targetY) boss.y += 1.5;

        if (boss.tier !== 5) {
            boss.x += boss.speedX * boss.dir;
            if (boss.x < boss.width / 2 + 15 || boss.x > W - boss.width / 2 - 15) boss.dir *= -1;
        } else {
            boss.x = W / 2;
        }

        if (boss.tier === 1) {
            if (gameTime - boss.lastShot > 65) {
                boss.lastShot = gameTime;
                [-35, 0, 35].forEach(off => {
                    enemyBullets.push({
                        x: boss.x + off,
                        y: boss.y + boss.height / 2,
                        vx: off * 0.02,
                        vy: 4.5,
                        radius: 5,
                        damage: 16
                    });
                });
            }
        } else if (boss.tier === 2) {
            if (gameTime - boss.lastShot > 75) {
                boss.lastShot = gameTime;
                [-50, -25, 0, 25, 50].forEach(off => {
                    enemyBullets.push({
                        x: boss.x + off,
                        y: boss.y + boss.height / 2,
                        vx: off * 0.02,
                        vy: 4.2,
                        radius: 6,
                        damage: 20
                    });
                });
            }

            if (gameTime % 22 === 0) {
                boss.spiralAngle += 0.35;
                for (let a = 0; a < 8; a++) {
                    if (a % 2 === 0) {
                        const ang = boss.spiralAngle + (Math.PI * 2 / 8) * a;
                        enemyBullets.push({
                            x: boss.x,
                            y: boss.y + 20,
                            vx: Math.cos(ang) * 2.6,
                            vy: Math.sin(ang) * 2.6,
                            radius: 7.5,
                            damage: player.maxHp * 0.2,
                            isHeavySpiral: true
                        });
                    }
                }
            }
        } else if (boss.tier === 3 || boss.tier === 4) {
            const dmgMult = (boss.tier === 4) ? 1.2 : 1.0;
            if (gameTime - boss.lastShot > 70) {
                boss.lastShot = gameTime;
                for (let c = -4; c <= 4; c++) {
                    if (c === 0) continue;
                    enemyBullets.push({
                        x: boss.x + c * 16,
                        y: boss.y + boss.height / 2,
                        vx: c * 0.35,
                        vy: 4.6,
                        radius: 6,
                        damage: player.maxHp * 0.05 * dmgMult
                    });
                }
            }

            if (!boss.hasFiredLaser && boss.hp < boss.maxHp * 0.75 && boss.laserState === 'none') {
                boss.laserState = 'aiming';
                boss.laserAimTimer = 160;
                addPopup(W / 2, H / 3, 'WARNING: TARGETED LASER AIMING! USE SHIELD!', '#ef4444');
            }

            if (boss.laserState === 'aiming') {
                boss.laserAimTimer--;
                boss.laserAngle = Math.atan2(player.y - boss.y, player.x - boss.x);
                if (boss.laserAimTimer <= 0) {
                    boss.laserState = 'firing';
                    fireBossLaser(boss.tier === 4 ? 2 : 1);
                    boss.hasFiredLaser = true;
                }
            }
        } else if (boss.tier === 5) {
            if (gameTime - boss.lastShot > 50) {
                boss.lastShot = gameTime;
                for (let a = -5; a <= 5; a++) {
                    enemyBullets.push({
                        x: boss.x + a * 20,
                        y: boss.y + boss.height / 2,
                        vx: a * 0.6,
                        vy: 4.8,
                        radius: 6,
                        damage: 22
                    });
                }
            }

            if (gameTime % 90 === 0) {
                [-80, 80].forEach(rx => {
                    enemyBullets.push({
                        x: boss.x + rx,
                        y: boss.y + 30,
                        vx: 0,
                        vy: 3.5,
                        radius: 9,
                        damage: 40,
                        isRocket: true
                    });
                });
            }

            boss.spawnEscortTimer++;
            if (boss.spawnEscortTimer > 280) {
                boss.spawnEscortTimer = 0;
                [-90, 90].forEach(hx => {
                    enemies.push({
                        x: boss.x + hx,
                        y: boss.y + 40,
                        vx: 1.2,
                        vy: 1.8,
                        offset: Math.random() * 5,
                        size: 32,
                        maxHp: 100 * player.tier,
                        hp: 100 * player.tier,
                        tier: player.tier
                    });
                });
                addPopup(boss.x, boss.y + 60, 'HANGAR ESCORTS LAUNCHED!', '#fda4af');
            }
        }
    } else {
        bossCooldown--;
        if (bossCooldown <= 0) spawnBoss();
    }

    for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const eb = enemyBullets[i];
        eb.x += eb.vx;
        eb.y += eb.vy;

        if (eb.y > H + 20 || eb.x < -20 || eb.x > W + 20) {
            enemyBullets.splice(i, 1);
            continue;
        }

        let hitWingman = false;
        for (let w = wingmen.length - 1; w >= 0; w--) {
            const wm = wingmen[w];
            if (Math.hypot(eb.x - wm.x, eb.y - wm.y) < eb.radius + wm.size) {
                wm.hp -= eb.damage;
                createExplosion(eb.x, eb.y, 4, '#34d399', 2);
                hitWingman = true;
                if (wm.hp <= 0) {
                    createExplosion(wm.x, wm.y, 16, '#38bdf8', 4);
                    wingmen.splice(w, 1);
                }
                break;
            }
        }

        if (hitWingman) {
            enemyBullets.splice(i, 1);
            continue;
        }

        if (Math.hypot(eb.x - player.x, eb.y - player.y) < eb.radius + player.width / 3) {
            enemyBullets.splice(i, 1);
            if (player.shieldHitsLeft > 0) {
                player.shieldHitsLeft--;
                createExplosion(eb.x, eb.y, 6, '#34d399', 3);
                playSound('shield_on');
                addPopup(player.x, player.y - 45, `BLOCKED! [${player.shieldHitsLeft}/5]`, '#34d399');
                if (player.shieldHitsLeft === 0) {
                    playSound('shield_break');
                    addPopup(player.x, player.y - 45, 'SHIELD BROKEN!', '#ef4444');
                }
            } else {
                damagePlayer(eb.damage);
            }
        }
    }

    for (let i = drops.length - 1; i >= 0; i--) {
        const d = drops[i];
        d.y += d.vy;
        d.pulse += 0.08;

        if (d.y > H + 30) {
            drops.splice(i, 1);
            continue;
        }

        let collected = false;
        if (Math.hypot(d.x - player.x, d.y - player.y) < player.width / 2 + d.width / 2) {
            collectDrop(d);
            collected = true;
        } else {
            for (let w = 0; w < wingmen.length; w++) {
                const wm = wingmen[w];
                if (Math.hypot(d.x - wm.x, d.y - wm.y) < wm.size + d.width / 2) {
                    collectDrop(d);
                    collected = true;
                    break;
                }
            }
        }

        if (collected) drops.splice(i, 1);
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;
        if (p.alpha <= 0) particles.splice(i, 1);
    }

    for (let i = textPopups.length - 1; i >= 0; i--) {
        const tp = textPopups[i];
        tp.y += tp.vy;
        tp.alpha -= 0.02;
        if (tp.alpha <= 0) textPopups.splice(i, 1);
    }

    if (screenShake > 0) screenShake *= 0.88;
}

function fireBossLaser(beamCount) {
    playSound('explosion');
    screenShake = 22;

    if (player.shieldHitsLeft > 0) {
        player.shieldHitsLeft = 0;
        player.shieldTimer = 0;
        playSound('shield_break');
        createExplosion(player.x, player.y, 25, '#34d399', 6);
        addPopup(player.x, player.y - 45, 'AEGIS SHIELD SHATTERED! 0 DAMAGE!', '#34d399');
    } else {
        const dmg = Math.floor(player.maxHp * 0.5);
        damagePlayer(dmg);
        addPopup(player.x, player.y - 45, `MEGA LASER DIRECT HIT! -${dmg} HP!`, '#ef4444');
    }

    shockwaves.push({ x: boss.x, y: boss.y + 40, radius: 10, maxRadius: 360, color: '#f43f5e', alpha: 1 });
    setTimeout(() => {
        if (boss) boss.laserState = 'done';
    }, 500);
}

function renderUnibeam() {
    if (player.unibeamTimer <= 0) return;

    const lvl = player.activeSkills[3].lvl;
    const startX = player.x;
    const startY = player.y - player.height / 2;

    let targets = [];
    if (lvl === 1) {
        let best = null, dMin = 9999;
        enemies.forEach(e => {
            const d = Math.hypot(e.x - player.x, e.y - player.y);
            if (d < dMin && e.y < player.y) { dMin = d; best = e; }
        });
        if (boss && boss.y < player.y && (!best || Math.hypot(boss.x - player.x, boss.y - player.y) < dMin)) best = boss;
        if (best) targets.push(best);
    } else if (lvl === 2) {
        targets = enemies.filter(e => e.y < player.y).slice(0, 2);
        if (boss && targets.length < 2) targets.push(boss);
    } else {
        targets = [...enemies.filter(e => e.y < player.y)];
        if (boss) targets.push(boss);
    }

    if (targets.length === 0) {
        targets.push({ x: startX + (Math.sin(gameTime * 0.2) * 8), y: -20, isDummy: true });
    }

    const beamDamage = (0.34 * lvl);

    targets.forEach(tgt => {
        if (!tgt.isDummy) {
            tgt.hp -= beamDamage;
            createExplosion(tgt.x, tgt.y, 2, '#38bdf8', 2);
            if (tgt.hp <= 0) {
                if (tgt === boss) destroyBoss();
                else {
                    const idx = enemies.indexOf(tgt);
                    if (idx !== -1) destroyEnemy(idx);
                }
            }
        }

        ctx.save();
        ctx.strokeStyle = '#06b6d4';
        ctx.lineWidth = (lvl >= 4 ? 12 : 6) + Math.sin(gameTime * 0.4) * 2;
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#22d3ee';
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(tgt.x, tgt.y);
        ctx.stroke();

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = (lvl >= 4 ? 4 : 2);
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(tgt.x, tgt.y);
        ctx.stroke();
        ctx.restore();
    });
}

function spawnPlayerBullets() {
    playSound('laser');
    const t = player.tier;
    if (t === 1) {
        bullets.push({
            x: player.x,
            y: player.y - 25,
            vx: 0,
            vy: -11,
            damage: 60,
            type: 'plasma_slug',
            radius: 4,
            color: '#38bdf8',
            splashRadius: 0
        });
    } else if (t === 2) {
        [-10, 10].forEach(off => {
            bullets.push({
                x: player.x + off,
                y: player.y - 20,
                vx: 0,
                vy: -12,
                damage: 70,
                type: 'plasma_slug',
                radius: 4.5,
                color: '#60a5fa',
                splashRadius: 0
            });
        });
    } else if (t === 3) {
        [-14, 0, 14].forEach((off, i) => {
            bullets.push({
                x: player.x + off,
                y: player.y - 22,
                vx: (i - 1) * 1.4,
                vy: -12.5,
                damage: 85,
                type: 'heavy_bolt',
                radius: 5,
                color: '#fbbf24',
                splashRadius: 0
            });
        });
    } else if (t >= 4) {
        [-20, -7, 7, 20].forEach((off, i) => {
            bullets.push({
                x: player.x + off,
                y: player.y - 24,
                vx: (i - 1.5) * 1.5,
                vy: -13,
                damage: 105,
                type: 'heavy_bolt',
                radius: 5.5,
                color: '#f97316',
                splashRadius: 0
            });
        });
    }
}

function spawnSoldier(tierOverride) {
    const tier = tierOverride || player.tier;
    enemies.push({
        x: Math.random() * (W - 80) + 40,
        y: -40,
        vx: Math.random() * 2 + 1,
        vy: Math.random() * 1.5 + 2.0,
        offset: Math.random() * 10,
        size: 26 + tier * 3,
        maxHp: 100 * tier,
        hp: 100 * tier,
        tier: tier
    });
}

function destroyEnemy(index) {
    const e = enemies[index];
    if (!e) return;
    enemies.splice(index, 1);
    createExplosion(e.x, e.y, 16, '#f97316', 4);
    playSound('explosion');

    const pts = SOLDIER_POINT_REWARDS[e.tier] || 1;
    upgradePoints += pts;
    score += pts * 10;

    document.getElementById('pts-txt').innerText = upgradePoints;
    document.getElementById('score-txt').innerText = score;
    addPopup(e.x, e.y, `+${pts} PT`, '#34d399');

    const rand = Math.random();
    if (rand < 0.28) spawnDrop(e.x, e.y);
    else if (rand < 0.42) spawnDrop(e.x, e.y, 'medkit');

    updateSkillsHUD();
}

function destroyBoss() {
    createExplosion(boss.x, boss.y, 60, '#f43f5e', 8);
    playSound('explosion');

    const pts = BOSS_POINT_REWARDS[boss.tier] || 10;
    upgradePoints += pts;
    score += pts * 20;

    wave++;
    document.getElementById('pts-txt').innerText = upgradePoints;
    document.getElementById('score-txt').innerText = score;
    document.getElementById('wave-txt').innerText = wave;
    document.getElementById('boss-ui').style.display = 'none';

    for (let i = 0; i < 3; i++) spawnDrop(boss.x + (i - 1) * 40, boss.y, 'score_orb');
    spawnDrop(boss.x, boss.y - 20, 'medkit');
    spawnDrop(boss.x, boss.y + 20, 'wingman_kit');

    boss = null;
    bossCooldown = 800;
    addPopup(W / 2, H / 3, `WAVE ${wave} ADVANCED! +${pts} PTS!`, '#fbbf24');
    updateSkillsHUD();
}

function collectDrop(d) {
    playSound('pickup');
    if (d.type === 'medkit') {
        player.hp = Math.min(player.maxHp, player.hp + 80);
        addPopup(player.x, player.y - 25, '+80 HP', '#10b981');
    } else if (d.type === 'wingman_kit') {
        addOrRepairWingman();
    } else if (d.type === 'score_orb') {
        upgradePoints += 5;
        score += 50;
        addPopup(player.x, player.y - 25, '+5 UPGRADE PTS', '#38bdf8');
    } else {
        upgradePoints += 2;
        score += 20;
        addPopup(player.x, player.y - 25, '+2 PTS', '#fbbf24');
    }
    document.getElementById('pts-txt').innerText = upgradePoints;
    document.getElementById('score-txt').innerText = score;
    updateHUD();
    updateSkillsHUD();
}

function damagePlayer(dmg) {
    player.hp -= dmg;
    screenShake = 12;
    createExplosion(player.x, player.y, 8, '#ef4444', 3);
    addPopup(player.x, player.y - 30, `-${Math.ceil(dmg)}`, '#ef4444');

    if (player.hp <= 0) {
        player.hp = 0;
        gameOver();
    }
    updateHUD();
}

function updateHUD() {
    const hpBar = document.getElementById('player-hp-bar');
    const hpVal = document.getElementById('hp-value');
    const pct = Math.max(0, (player.hp / player.maxHp) * 100);

    hpBar.style.width = `${pct}%`;
    hpVal.innerText = `${Math.ceil(player.hp)} / ${player.maxHp}`;

    if (pct > 55) hpBar.style.background = 'linear-gradient(90deg, #10b981, #059669)';
    else if (pct > 25) hpBar.style.background = 'linear-gradient(90deg, #f59e0b, #d97706)';
    else hpBar.style.background = 'linear-gradient(90deg, #ef4444, #dc2626)';
}

function updateBossHUD() {
    if (!boss) return;
    const pct = Math.max(0, (boss.hp / boss.maxHp) * 100);
    document.getElementById('boss-hp-fill').style.width = `${pct}%`;
}

function gameOver() {
    isGameOver = true;
    document.getElementById('final-score').innerText = score;
    document.getElementById('game-over-screen').style.display = 'flex';
}

function restartGame() {
    score = 0;
    upgradePoints = 0;
    wave = 1;
    gameTime = 0;
    isGameOver = false;
    isPaused = false;
    player.maxHp = player.baseMaxHp;
    player.hp = player.maxHp;
    targetX = player.x = W / 2;
    targetY = player.y = H * 0.8;
    player.tier = 1;
    player.shieldHitsLeft = 0;
    player.shieldTimer = 0;
    player.unibeamTimer = 0;

    bullets = [];
    enemyBullets = [];
    enemies = [];
    drops = [];
    particles = [];
    shockwaves = [];
    blackHoles = [];
    boss = null;
    bossCooldown = 500;

    refreshWingmen();

    for (let s = 1; s <= 5; s++) {
        player.activeSkills[s].lvl = 1;
        player.activeSkills[s].cooldown = 0;
    }

    document.getElementById('tier-badge').innerText = 'MK-1';
    document.getElementById('pts-txt').innerText = '0';
    document.getElementById('score-txt').innerText = '0';
    document.getElementById('wave-txt').innerText = '1';
    document.getElementById('boss-ui').style.display = 'none';
    updateHUD();
    updateSkillsHUD();
}

/**
 * Image-Render Engine (Direct PNG Rendering without extra rotation)
 */
function drawPlayerJet(p) {
    ctx.save();
    ctx.translate(p.x, p.y);

    if (p.shieldHitsLeft > 0) {
        ctx.strokeStyle = '#34d399';
        ctx.lineWidth = 2.5;
        ctx.shadowBlur = 16;
        ctx.shadowColor = '#34d399';

        const r = p.width * 0.9;
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
            const angle = (Math.PI / 3) * i + (gameTime * 0.02);
            const hx = Math.cos(angle) * r;
            const hy = Math.sin(angle) * r;
            if (i === 0) ctx.moveTo(hx, hy);
            else ctx.lineTo(hx, hy);
        }
        ctx.closePath();
        ctx.stroke();

        ctx.fillStyle = 'rgba(52, 211, 153, 0.12)';
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.fillStyle = '#34d399';
        ctx.font = 'bold 10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(`HITS: ${p.shieldHitsLeft}/5`, 0, -p.height / 2 - 14);
    }

    const img = IMAGES.main[p.tier];
    if (img && img.complete && img.naturalWidth !== 0) {
        ctx.drawImage(img, -p.width / 2, -p.height / 2, p.width, p.height);
    } else {
        const t = p.tier;
        ctx.fillStyle = (t <= 2) ? '#1e3a8a' : (t <= 4 ? '#7f1d1d' : '#831843');
        ctx.strokeStyle = (t <= 2) ? '#60a5fa' : (t <= 4 ? '#f97316' : '#f43f5e');
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, -p.height / 2);
        ctx.lineTo(p.width / 2, p.height / 3);
        ctx.lineTo(p.width / 4, p.height / 2);
        ctx.lineTo(-p.width / 4, p.height / 2);
        ctx.lineTo(-p.width / 2, p.height / 3);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
    }

    ctx.restore();
}

function drawWingman(wm) {
    ctx.save();
    ctx.translate(wm.x, wm.y);

    const pct = Math.max(0, wm.hp / wm.maxHp);
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(-14, -wm.size - 8, 28, 3.5);
    ctx.fillStyle = '#34d399';
    ctx.fillRect(-14, -wm.size - 8, 28 * pct, 3.5);

    const img = IMAGES.helper[wm.tier];
    if (img && img.complete && img.naturalWidth !== 0) {
        ctx.drawImage(img, -wm.size, -wm.size, wm.size * 2, wm.size * 2);
    } else {
        ctx.fillStyle = '#3f4818';
        ctx.strokeStyle = '#eab308';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(0, -wm.size);
        ctx.lineTo(wm.size * 0.85, wm.size * 0.75);
        ctx.lineTo(0, wm.size * 0.3);
        ctx.lineTo(-wm.size * 0.85, wm.size * 0.75);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
    }

    ctx.restore();
}

function drawEnemyJet(e) {
    ctx.save();
    ctx.translate(e.x, e.y);

    const img = IMAGES.enemy[e.tier];
    if (img && img.complete && img.naturalWidth !== 0) {
        ctx.drawImage(img, -e.size, -e.size, e.size * 2, e.size * 2);
    } else {
        ctx.fillStyle = '#450a0a';
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(0, e.size);
        ctx.lineTo(e.size * 0.9, -e.size * 0.5);
        ctx.lineTo(0, -e.size * 0.2);
        ctx.lineTo(-e.size * 0.9, -e.size * 0.5);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
    }

    ctx.restore();
}

function drawBossJet(b) {
    ctx.save();
    ctx.translate(b.x, b.y);

    if (b.laserState === 'aiming') {
        ctx.strokeStyle = 'rgba(239, 68, 68, 0.75)';
        ctx.lineWidth = 2;
        ctx.setLineDash([8, 6]);
        ctx.beginPath();
        ctx.moveTo(0, b.height / 2);
        ctx.lineTo(Math.cos(b.laserAngle) * 800, Math.sin(b.laserAngle) * 800);
        ctx.stroke();
        ctx.setLineDash([]);
    }

    const img = IMAGES.boss[b.tier];
    if (img && img.complete && img.naturalWidth !== 0) {
        ctx.drawImage(img, -b.width / 2, -b.height / 2, b.width, b.height);
    } else {
        ctx.fillStyle = '#1c1917';
        ctx.strokeStyle = '#f43f5e';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, b.height / 2);
        ctx.lineTo(b.width / 2, -b.height / 4);
        ctx.lineTo(b.width / 3, -b.height / 2);
        ctx.lineTo(-b.width / 3, -b.height / 2);
        ctx.lineTo(-b.width / 2, -b.height / 4);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
    }

    ctx.restore();
}

/**
 * Rendering Loop
 */
function draw() {
    ctx.clearRect(0, 0, W, H);

    ctx.save();
    if (screenShake > 0.5) {
        ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
    }

    stars.forEach(s => {
        ctx.fillStyle = `rgba(186, 230, 253, ${s.alpha})`;
        ctx.fillRect(s.x, s.y, s.size, s.size);
    });

    shockwaves.forEach(sw => {
        ctx.strokeStyle = sw.color;
        ctx.globalAlpha = sw.alpha;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
        ctx.stroke();
    });
    ctx.globalAlpha = 1;

    blackHoles.forEach(bh => {
        const grad = ctx.createRadialGradient(bh.x, bh.y, bh.currentRadius * 0.2, bh.x, bh.y, bh.currentRadius);
        grad.addColorStop(0, '#000000');
        grad.addColorStop(0.5, '#581c87');
        grad.addColorStop(0.9, '#c084fc');
        grad.addColorStop(1, 'transparent');

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(bh.x, bh.y, bh.currentRadius, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#e879f9';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(bh.x, bh.y, bh.currentRadius * 0.75, 0, Math.PI * 2);
        ctx.stroke();
    });

    drops.forEach(d => {
        ctx.save();
        ctx.translate(d.x, d.y);
        const scale = 1 + Math.sin(d.pulse) * 0.12;
        ctx.scale(scale, scale);

        if (d.type === 'medkit') {
            ctx.fillStyle = '#10b981';
            ctx.fillRect(-11, -11, 22, 22);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(-2.5, -7, 5, 14);
            ctx.fillRect(-7, -2.5, 14, 5);
        } else if (d.type === 'wingman_kit') {
            ctx.fillStyle = '#0284c7';
            ctx.beginPath();
            ctx.arc(0, 0, 13, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.fillStyle = '#ffffff';
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('✈️', 0, 1);
        } else if (d.type === 'score_orb') {
            ctx.fillStyle = '#0284c7';
            ctx.beginPath();
            ctx.arc(0, 0, 11, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 9px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('PT', 0, 0);
        } else {
            ctx.fillStyle = '#f59e0b';
            ctx.fillRect(-9, -9, 18, 18);
        }
        ctx.restore();
    });

    bullets.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
    });

    enemyBullets.forEach(eb => {
        ctx.fillStyle = eb.isHeavySpiral ? '#a855f7' : (eb.isRocket ? '#f97316' : '#f43f5e');
        ctx.beginPath();
        ctx.arc(eb.x, eb.y, eb.radius, 0, Math.PI * 2);
        ctx.fill();
    });

    enemies.forEach(e => drawEnemyJet(e));

    if (boss) drawBossJet(boss);

    wingmen.forEach(wm => drawWingman(wm));

    renderUnibeam();

    drawPlayerJet(player);

    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.fillRect(p.x, p.y, p.size, p.size);
    });
    ctx.globalAlpha = 1;

    textPopups.forEach(tp => {
        ctx.fillStyle = tp.color;
        ctx.globalAlpha = tp.alpha;
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText(tp.text, tp.x, tp.y);
    });
    ctx.globalAlpha = 1;

    ctx.restore();
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

refreshWingmen();
updateHUD();
updateSkillsHUD();
requestAnimationFrame(gameLoop);
</script>
